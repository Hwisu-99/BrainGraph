<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoNote</title>
<link rel="stylesheet" href="/graph.css" />
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --border: #E8E6DC;
    --text: #141413;
    --text-muted: #6B6A65;
    --accent: #D97757;
    --accent-hover: #C86A4C;
    --accent-soft: #FBE9E1;
    --error: #C0442F;
    --error-soft: #FCEBE7;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(20,20,19,.04), 0 6px 16px rgba(20,20,19,.05);

    /* 타이포그래피 스케일 - 이전엔 .7rem~2.1rem 사이 12개 넘는 임의값이 흩어져
       있었다. 용도별로 6단계만 두고 전부 이 변수를 통해서만 쓴다. */
    --fs-xs: .72rem;    /* 폴더 토글 화살표, 극소 라벨, eyebrow */
    --fs-sm: .8rem;     /* 메타 정보, 보조 텍스트 */
    --fs-base: .85rem;  /* 본문 기본값(리스트 행, 버튼) */
    --fs-md: .92rem;    /* 강조 본문(카드 안내문, 드롭존 안내) */
    --fs-lg: 1.05rem;   /* 카드 제목 */
    --fs-xl: 1.3rem;    /* 페이지 헤딩(h1) */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1F1E1D;
      --surface: #262624;
      --border: #3A3936;
      --text: #F5F4ED;
      --text-muted: #A9A79E;
      --accent: #E08A67;
      --accent-hover: #EA9C7C;
      --accent-soft: #3A2A22;
      --error: #E5806B;
      --error-soft: #3A2420;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    transition: background .2s ease, color .2s ease;
  }
  /* 대시보드형 상단바 - 화면 폭 전체에 걸쳐 고정된 앱 셸을 준다. 안의 내용은
     .page와 같은 1720px 폭으로 가운데 정렬해 아래 레이아웃과 좌우가 맞는다. */
  .topnav {
    width: 100%; height: 56px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .topnav-inner { width: 100%; max-width: 1720px; padding: 0 40px; display: flex; align-items: center; gap: 10px; }
  /* 배지(뱃지 배경/테두리) 없이, 원래 아이콘 자리에 있던 인라인 SVG와 같은
     방식으로 둔다 - 투명 배경 PNG를 자연 비율 그대로, 높이만 텍스트 줄과
     맞춰서. */
  .brand-mark { height: 22px; width: auto; flex-shrink: 0; }
  .brand-name { font-size: var(--fs-base); font-weight: 700; color: var(--text); letter-spacing: -.005em; }
  /* 실제로 존재하지 않는 메뉴(그래프/설정 등)를 링크로 늘어놓는 대신, 지금
     Brain에 뭐가 얼마나 쌓여 있는지(실측치)를 상시 보여주는 상태 표시줄로
     쓴다 - papers.js/graph.js가 각각 채운다. */
  .topnav-stats { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; }
  .topnav-stats .sep { opacity: .5; }
  /* 링크를 눌러야만(Sync Dashboard 페이지) 보이는 대신, 메인 화면을 벗어나지
     않아도 "로컬과 Neo4j가 어긋나 있다"를 바로 알 수 있어야 해서 상단바에도
     항상 폴링하는 배지를 하나 둔다 - 평소(미해결 실패 없음)엔 아예 숨어서
     통계 줄을 방해하지 않는다. */
  .sync-status-badge {
    display: none; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: var(--fs-xs); font-weight: 700; text-decoration: none; white-space: nowrap;
    background: var(--error-soft); color: var(--error); border: 1px solid var(--error);
  }
  .sync-status-badge.show { display: inline-flex; }
  .sync-status-badge:hover { background: var(--error); color: var(--surface); }

  .page { display: flex; flex-direction: column; align-items: center; padding: 24px 20px 64px; }

  main { width: 100%; max-width: 640px; }
  .eyebrow {
    font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px;
  }

  /* flex: 0 0 300px만으로는 폭이 고정되지 않는다 - width가 auto(비확정)면
     flex item의 "자동 최소 크기"가 안의 긴 논문 제목 같은 content-based
     minimum으로 정해져서, 그게 300px보다 크면 flex-shrink:0이어도 그
     최소 크기까지 넓어진다(overflow:hidden으로 이 자동 최소값을 0으로
     만드는 게 보통의 해법이지만, 그러면 sticky가 깨진다 - 크롬에서도
     이 조합에서 재현 확인됨). 그래서 width를 명시적으로도 박아 "확정된
     크기"로 만든다 - 그러면 자동 최소 크기 계산이 min(content-based, 300)
     = 300으로 정리된다.

     사이드바는 #paperListPanel 하나뿐이지만, sticky/폭 고정은 그걸 감싼
     열(.sidebar-col)에 걸어둔다(패널을 감싸는 별도 레이어가 있어야 나중에
     이 열에 뭔가 더 얹더라도 sticky/폭 계산을 다시 안 건드려도 된다). */
  .sidebar-col { flex: 0 0 300px; width: 300px; position: sticky; top: 80px; display: flex; flex-direction: column; gap: 12px; }
  #paperListPanel {
    width: 100%; height: 620px; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column;
  }
  /* 예전엔 "저장된 논문" 라벨 + 버튼 하나였는데, 라벨을 빼고 나니 이 줄 전체가
     아이콘 버튼 묶음(Brain 탭 토글/새 폴더/전체 펼치기·접기/정렬/밀도) 하나로
     채워진다 - 텍스트가 없어졌으니 좌우로 벌릴 대상도 없어서 justify-content는
     그냥 기본값(flex-start)으로 왼쪽부터 채운다. */
  .panel-title-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: -20px -20px 12px; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  /* 참고 이미지처럼 아이콘끼리 넉넉히 떨어진 툴바 배치 - 이전엔 gap:2px로
     다닥다닥 붙어 있었다. */
  .panel-title-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  /* 이 5개 버튼만 더 크고 색이 다르게 - 공유 클래스(.panel-icon-btn)의 26px
     히트박스/회색은 논문·폴더 행 아이콘(같은 클래스 재사용)까지 다 같이
     바뀌므로 건드리지 않고, panel-title-actions 안에서만 덮어쓴다. 색은
     그래프 뷰의 논문(note) 노드와 같은 --accent - 이 패널이 다루는 게
     결국 논문이라 그 노드 색과 맞춘다. */
  .panel-title-actions .panel-icon-btn { width: 34px; height: 34px; color: var(--accent); }
  /* 아이콘 버튼 3종(패널 헤더의 새 폴더, 논문/폴더 행의 그래프 토글·삭제)은
     크기·모양이 완전히 같은 하나의 컴포넌트였는데 각자 따로 정의돼 있었다 -
     여기서 베이스를 하나로 합치고, 호버 시 의미에 따라 갈리는 색(중립=accent,
     파괴적 동작=error)만 개별로 얹는다. */
  .panel-icon-btn, .paper-graph-btn, .paper-delete-btn {
    flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .panel-icon-btn:hover, .paper-graph-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .panel-icon-btn.active, .paper-graph-btn.active { background: var(--accent); color: var(--surface); }
  .panel-icon-btn.active:hover, .paper-graph-btn.active:hover { background: var(--accent-hover, var(--accent)); }
  /* 뇌 아이콘은 raster 이미지라 currentColor로 흰색 반전이 안 된다 - active일 때
     배경을 꽉 채우는 대신 옅은 링으로 "선택됨"을 표시한다. */
  .brain-icon-img { width: 22px; height: auto; display: block; }
  #btnToggleBrainTabs.active, #btnToggleBrainTabs.active:hover {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .paper-delete-btn:hover { background: var(--error-soft); color: var(--error); }
  /* 촘촘하게 보기 토글(#btnToggleDensity) - 행 패딩/간격만 줄인다. */
  #paperList.compact .paper-title { padding: 3px 8px; }
  #paperList.compact .folder-name { padding: 3px 4px; }
  #paperList.compact { gap: 0; }
  #paperList.compact .folder-body { gap: 0; }
  #paperList {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; min-width: 0;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  /* 파이어폭스는 scrollbar-width/color로 충분하지만, 크롬/엣지/사파리(WebKit)는
     기본 스크롤바가 굵게 나와서 별도 의사 요소로 얇게 맞춰야 한다. */
  #paperList::-webkit-scrollbar { width: 6px; }
  #paperList::-webkit-scrollbar-track { background: transparent; }
  #paperList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  #paperList::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  /* min-width: 0 - #paperList가 flex-column이라 .paper-row/.folder-block도 그
     안의 flex item이다. 기본값 min-width:auto인 flex item은 안의 긴 논문
     제목(.paper-title에 이미 overflow:hidden+ellipsis가 있어도) 때문에 패널
     전체가 옆으로 넓어지는 문제가 있었다 - 사이드바 패널 자체(#paperListPanel)의
     overflow는 sticky를 깨뜨리므로(WebKit 버그) 건드리지 않고, 실제 텍스트를
     감싸는 이 안쪽 flex item에서 폭을 끊어야 한다. */
  .paper-row {
    display: flex; align-items: center; gap: 6px; border-left: 2px solid transparent;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0; min-width: 0;
    padding: 2px; transition: background .15s ease, border-color .15s ease; cursor: grab;
  }
  .paper-row.selected { background: var(--bg); border-left-color: var(--accent); }
  .paper-row.dragging { opacity: .4; }
  .paper-title {
    flex: 1; text-align: left; font-size: var(--fs-base); color: var(--text);
    line-height: 1.35; padding: 6px 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .paper-row.selected .paper-title { color: var(--accent); font-weight: 600; }
  .paper-empty { font-size: var(--fs-sm); color: var(--text-muted); padding: 8px 10px; }

  /* 옵시디언 파일 탐색기처럼 폴더로 논문을 묶어 보여주는 영역. 실제 vault 파일
     위치는 안 바뀌고(가상 폴더), 어느 논문이 어느 폴더에 속하는지만 로컬에
     기록된다(paper_notes/paper_folders.py). 논문 행을 폴더 위로 드래그해서
     넣고 빼므로(papers.js), 드래그 중인 폴더는 drag-over 클래스로 강조한다. */
  .folder-block { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; border-radius: var(--radius-sm); min-width: 0; }
  .folder-block.drag-over { background: var(--accent-soft); }
  .folder-block.dragging { opacity: .4; }
  .folder-header { display: flex; align-items: center; gap: 2px; border-radius: var(--radius-sm); padding: 2px; min-width: 0; }
  .folder-toggle-btn {
    flex-shrink: 0; width: 18px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: var(--fs-xs); padding: 0;
  }
  .folder-icon { flex-shrink: 0; display: flex; align-items: center; color: var(--text-muted); }
  .folder-name {
    flex: 1; text-align: left; font-size: var(--fs-base); font-weight: 600; color: var(--text);
    padding: 6px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-body { display: flex; flex-direction: column; gap: 2px; margin-left: 20px; min-width: 0; }
  /* "+ 폴더" 클릭 시 옵시디언처럼 목록 맨 위에 바로 이름 입력 상태로 나타나는
     임시 행 - 확인 버튼 없이 Enter/포커스 아웃으로 바로 생성된다(papers.js). */
  .folder-ghost-row { display: flex; align-items: center; gap: 2px; padding: 2px; }
  .folder-name-input {
    flex: 1; min-width: 0; font-size: var(--fs-base); font-weight: 600; color: var(--text);
    padding: 5px 6px; margin: 1px 0; border-radius: var(--radius-sm);
    border: 1px solid var(--accent); background: var(--surface); outline: none;
  }

  /* Brain별로 묶어보기(뇌 아이콘 토글) - #brainTabs 탭 바가 하던 일을 이제
     #paperList 안에서 직접 한다. 폴더와 같은 감싸기(.folder-block)/토글
     구조를 그대로 재사용하되, 그 위 한 단계 컨테이너라는 걸 표시하려고
     헤더 배경만 옅게 얹는다 - 안쪽 folder-block/paper-row는 평소와 완전히
     같은 컴포넌트다(brain-body에 folder-body와 같은 들여쓰기 클래스를 쓴다). */
  .brain-block { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; border-radius: var(--radius-sm); min-width: 0; }
  .brain-header {
    display: flex; align-items: center; gap: 2px; border-radius: var(--radius-sm); padding: 2px;
    min-width: 0; background: var(--accent-soft);
  }
  .brain-header.drag-over { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .brain-block.dragging { opacity: .4; }
  .brain-block-icon { flex-shrink: 0; width: 14px; height: 14px; display: block; margin: 0 4px 0 2px; }
  .brain-body { margin-left: 20px; }
  .brain-body .paper-empty { padding: 4px; }
  .brain-add-row {
    display: block; width: 100%; text-align: left; margin-bottom: 4px;
    padding: 6px 4px; border-radius: var(--radius-sm); border: none; background: none;
    color: var(--text-muted); font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
  }
  .brain-add-row:hover { background: var(--accent-soft); color: var(--accent); }
  .brain-ghost-row { display: flex; align-items: center; padding: 2px; margin-bottom: 4px; }
  .brain-name-input {
    flex: 1; min-width: 0; font-size: var(--fs-base); font-weight: 600; color: var(--text);
    padding: 5px 6px; margin: 1px 0; border-radius: var(--radius-sm);
    border: 1px solid var(--accent); background: var(--surface); outline: none;
  }

  h1 {
    font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.01em; color: var(--text);
    margin: 0 0 24px; line-height: 1.4;
  }

  #dropzone {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, transform .18s ease;
    box-shadow: var(--shadow);
  }
  #dropzone:hover { border-color: var(--accent); transform: translateY(-1px); }
  #dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }

  .dz-icon {
    width: 36px; height: 36px; margin: 0 auto 12px;
    border-radius: var(--radius-sm); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .dz-title { font-weight: 600; font-size: var(--fs-md); margin-bottom: 4px; }
  .dz-hint { color: var(--text-muted); font-size: var(--fs-sm); }
  input[type=file] { display: none; }

  #progressWrap { margin-top: 28px; display: none; }
  #progressBar {
    width: 100%; height: 8px; background: var(--border);
    border-radius: 999px; overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  #progressLabel {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .progress-status {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-muted); font-size: var(--fs-sm);
  }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 그래프 뷰의 .graph-btn(graph.css)과 같은 "알약형" 버튼 컴포넌트 - 패딩/폰트/
     radius를 그대로 맞춰서 페이지 어디서든 같은 버튼으로 보이게 한다. */
  #cancelBtn {
    background: none; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text-muted); font-size: var(--fs-sm); font-weight: 600;
    padding: 5px 14px; cursor: pointer; flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease;
  }
  #cancelBtn:hover { border-color: var(--error); color: var(--error); }

  #status { margin-top: 16px; }
  /* 대시보드형은 왼쪽 색띠로 상태를 구분하는 좀 더 전통적인 방식을 쓴다(카드
     맨 위 상태 라벨은 유지 - 색만으로는 색맹 사용자에게 안 보이므로 텍스트도
     같이 남긴다). */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 16px 18px;
    box-shadow: var(--shadow); animation: rise .25s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card-status {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .card-status .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .result .card-status { color: var(--accent); }
  .error { background: var(--error-soft); border-color: var(--error-soft); border-left-color: var(--error); color: var(--error); }
  .cancelled { border-left-color: var(--text-muted); color: var(--text-muted); }
  .cancelled .card-status { color: var(--text-muted); }

  .result strong { font-size: var(--fs-lg); display: block; margin-bottom: 6px; }
  .result p { margin: 0 0 14px; color: var(--text-muted); line-height: 1.55; }
  .meta-row {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: var(--fs-sm); padding: 8px 0; border-top: 1px solid var(--border);
    color: var(--text-muted);
  }
  .meta-row span:first-child { flex-shrink: 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--fs-sm); color: var(--text); text-align: right;
    overflow-wrap: anywhere;
  }

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<!-- concept/entity 메모에 블로그 등 외부 페이지를 복사-붙여넣기할 때, 그 서식 섞인
     HTML을 우리가 지원하는 마크다운으로 즉시 변환해두기 위함(graph.js의 handleRichPaste). -->
<script src="https://unpkg.com/turndown@7.2.0/dist/turndown.js"></script>
<script>
  // startOnLoad:false - 노트를 열 때(openNodeView) graph.js가 mermaid.run()을 직접
  // 호출한다. 페이지에 실제로 있는 mermaid 블록만 그 순간 골라 그리기 위함.
  mermaid.initialize({
    startOnLoad: false,
    theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
  });
</script>
<script src="/graph.js"></script>
<script src="/papers.js"></script>
<script src="/inspector.js"></script>
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const spinner = document.querySelector('.spinner');
const cancelBtn = document.getElementById('cancelBtn');

let abortController = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});
cancelBtn.addEventListener('click', () => {
  abortController?.abort();
});

const NODE_TYPE_LABELS = { note: '논문', concept: '개념', entity: '용어', tag: '태그' };

function renderNodeSummaryRows(nodeSummary) {
  if (!nodeSummary) return '';
  return Object.keys(NODE_TYPE_LABELS)
    .filter((type) => nodeSummary[type] && nodeSummary[type].length > 0)
    .map((type) => {
      const names = nodeSummary[type].join(', ');
      return `<div class="meta-row"><span>${NODE_TYPE_LABELS[type]} (${nodeSummary[type].length})</span><code>${names}</code></div>`;
    })
    .join('');
}

function setProgress(percent, message, done = false) {
  progressWrap.style.display = 'block';
  progressFill.style.width = `${percent}%`;
  progressText.textContent = message;
  spinner.style.display = done ? 'none' : 'block';
  cancelBtn.style.display = done ? 'none' : 'inline-block';
}

async function handleFile(file) {
  statusEl.innerHTML = '';
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    statusEl.innerHTML = '<div class="card error"><div class="card-status"><span class="status-dot"></span>오류</div>PDF 파일만 지원합니다.</div>';
    return;
  }

  // Claude를 부르기 전에(무료) 같은 논문이 이미 처리돼있는지 먼저 확인한다. 제목
  // 문자열은 재처리할 때마다 Claude가 다르게 낼 수 있어 믿을 수 없으므로, 서버가
  // 원문 텍스트 해시로 비교한다.
  let overwriteSlug = null;
  try {
    const checkFormData = new FormData();
    checkFormData.append('file', file);
    const checkRes = await fetch('/api/check-duplicate', { method: 'POST', body: checkFormData });
    if (checkRes.ok) {
      const checkData = await checkRes.json();
      if (checkData.duplicate) {
        const proceed = confirm(`"${checkData.title}" 논문이 이미 있습니다.\n다시 처리해서 덮어쓸까요?`);
        if (!proceed) return;
        overwriteSlug = checkData.slug;
      }
    }
  } catch {
    // 중복 확인 자체가 실패해도(네트워크 등) 평소처럼 새로 처리하도록 진행한다.
  }

  abortController = new AbortController();
  setProgress(0, `"${file.name}" 업로드 중...`);

  const formData = new FormData();
  formData.append('file', file);
  if (overwriteSlug) formData.append('overwrite_slug', overwriteSlug);

  try {
    const res = await fetch('/api/process', { method: 'POST', body: formData, signal: abortController.signal });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      progressWrap.style.display = 'none';
      statusEl.innerHTML = `<div class="card error"><div class="card-status"><span class="status-dot"></span>오류</div>${data.detail || res.statusText}</div>`;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let newlineIndex;
      while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, newlineIndex).trim();
        buffer = buffer.slice(newlineIndex + 1);
        if (!line) continue;

        const evt = JSON.parse(line);
        if (evt.stage === 'error') {
          progressWrap.style.display = 'none';
          statusEl.innerHTML = `<div class="card error"><div class="card-status"><span class="status-dot"></span>오류</div>${evt.message}</div>`;
          return;
        }
        if (evt.stage === 'done') {
          setProgress(100, evt.message, true);
          statusEl.innerHTML = `
            <div class="card result">
              <div class="card-status"><span class="status-dot"></span>완료</div>
              <strong>${evt.title}</strong>
              <p>${evt.tldr}</p>
              <div class="meta-row"><span>노트</span><code>${evt.note_path}</code></div>
              <div class="meta-row"><span>API 비용</span><code>$${evt.api_cost_usd.toFixed(4)}</code></div>
              <div class="meta-row"><span>Supabase</span><code>${evt.supabase_path ? evt.supabase_path : ('업로드 실패: ' + evt.supabase_error)}</code></div>
              ${renderNodeSummaryRows(evt.node_summary)}
            </div>`;
          loadGraph([], false);
          selectedPaperSlugs.add(evt.title_slug);
          loadPaperList();
        } else {
          setProgress(evt.percent, evt.message);
        }
      }
    }
  } catch (err) {
    progressWrap.style.display = 'none';
    if (err.name === 'AbortError') {
      statusEl.innerHTML = '<div class="card cancelled">취소되었습니다.</div>';
    } else {
      statusEl.innerHTML = `<div class="card error"><div class="card-status"><span class="status-dot"></span>오류</div>요청 실패: ${err}</div>`;
    }
  } finally {
    abortController = null;
  }
}

// 상단바 배지 - "로컬은 바뀌었는데 Neo4j 반영은 실패한 채로 남아 있다"를
// 사용자가 Sync Dashboard(/sync_dashboard.html)를 따로 열어보지 않아도 메인
// 화면에서 바로 알 수 있게 한다. logs/sync_queue.json은 디스크에 남으므로
// 앱을 재시작해도 unresolved_count가 그대로 유지된다 - 이 배지도 새로고침
// 즉시 그 값을 다시 보여준다.
(function pollSyncStatus() {
  fetch('/api/sync-operations?limit=1')
    .then((res) => res.json())
    .then((data) => {
      const badge = document.getElementById('syncStatusBadge');
      const count = data.unresolved_count || 0;
      badge.classList.toggle('show', count > 0);
      badge.textContent = count > 0 ? `⚠ Neo4j 동기화 실패 ${count}건` : '';
    })
    .catch(() => {}); // 서버가 아직 안 떴거나 잠깐 응답이 없어도 다음 폴링에서 다시 시도
  setTimeout(pollSyncStatus, 5000);
})();
</script>
